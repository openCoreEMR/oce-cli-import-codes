name: Release Please

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    uses: opencoreemr/github-workflows-public/.github/workflows/release-please-reusable.yml@1.0.0
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  # Build and attach PHAR to release.
  # Called directly because release events from GITHUB_TOKEN don't trigger
  # other workflows (GitHub security feature).
  build-phar:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-phar.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
