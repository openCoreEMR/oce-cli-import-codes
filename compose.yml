# OpenEMR CLI Import Codes - Development Environment
#
# Extends OpenEMR's development-easy services with overrides:
# - Random ports bound to 127.0.0.1 (avoid conflicts; never expose dev DB to LAN)
# - CLI tool mounted into OpenEMR container

name: oce-cli-import-codes

services:
  couchdb:
    ports: !override
    - target: 5984
      host_ip: 127.0.0.1
      protocol: tcp
      mode: host
    - target: 6984
      host_ip: 127.0.0.1
      protocol: tcp
      mode: host
    extends:
      file: vendor/openemr/openemr/docker/development-easy/docker-compose.yml
      service: couchdb

  mysql:
    ports: !override
    - target: 3306
      host_ip: 127.0.0.1
      protocol: tcp
      mode: host
    extends:
      file: vendor/openemr/openemr/docker/development-easy/docker-compose.yml
      service: mysql

  openemr:
    volumes:
    - .:/var/www/localhost/htdocs/openemr/oce-cli-import-codes:rw
    ports: !override
    - target: 80
      host_ip: 127.0.0.1
      protocol: tcp
      mode: host
    - target: 443
      host_ip: 127.0.0.1
      protocol: tcp
      mode: host
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:443/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3m
    extends:
      file: vendor/openemr/openemr/docker/development-easy/docker-compose.yml
      service: openemr

  openldap:
    extends:
      file: vendor/openemr/openemr/docker/development-easy/docker-compose.yml
      service: openldap

  phpmyadmin:
    ports: !override
    - target: 80
      host_ip: 127.0.0.1
      protocol: tcp
      mode: host
    extends:
      file: vendor/openemr/openemr/docker/development-easy/docker-compose.yml
      service: phpmyadmin

volumes:
  databasevolume: {}
  assetvolume: {}
  themevolume: {}
  sitesvolume: {}
  nodemodules: {}
  vendordir: {}
  ccdanodemodules: {}
  logvolume: {}
  couchdbvolume: {}
